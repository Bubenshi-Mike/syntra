name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Syntra.slnx

      - name: Build
        run: dotnet build Syntra.slnx -c Release --no-restore

      - name: Format check
        run: dotnet format Syntra.slnx --verify-no-changes

      - name: Test
        run: dotnet test Syntra.slnx -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack Syntra.slnx -c Release --no-build -o "${{ github.workspace }}/artifacts"

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
