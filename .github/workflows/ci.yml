name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Syntra.slnx

      - name: Build
        run: dotnet build Syntra.slnx -c Release --no-restore

      # Known gap: coverlet's static instrumentation can't resolve Microsoft.Extensions.*
      # assemblies trimmed from build output because Syntra.Behaviors' FrameworkReference
      # on Microsoft.AspNetCore.App marks them as framework-provided. Syntra.Behaviors and
      # Syntra.DependencyInjection are silently absent from the coverage report as a result
      # (verified: neither CopyLocalLockFileAssemblies nor PreserveCompilationContext fix it).
      # Resolving the FrameworkReference (see roadmap) would likely fix this too.
      - name: Test
        run: dotnet test Syntra.slnx -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory "${{ github.workspace }}/coverage"

      - name: Pack
        run: dotnet pack Syntra.slnx -c Release --no-build -o "${{ github.workspace }}/artifacts"

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/**/coverage.cobertura.xml

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11

      # Informational only, no threshold gate yet - the current numbers are skewed by the
      # known Syntra.Behaviors/Syntra.DependencyInjection instrumentation gap (see above),
      # so any percentage chosen against today's baseline wouldn't be meaningful.
      - name: Generate coverage summary
        run: |
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:"coveragereport" \
            -reporttypes:"MarkdownSummaryGithub"
          cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
