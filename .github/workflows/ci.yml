name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      # Full history (not the default shallow clone) - the package version is derived from
      # the total commit count via `git rev-list --count HEAD` (see Directory.Build.props),
      # which needs the whole history to be accurate.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Syntra.slnx

      - name: Build
        run: dotnet build Syntra.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Syntra.slnx -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack Syntra.slnx -c Release --no-build -o "${{ github.workspace }}/artifacts"

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
