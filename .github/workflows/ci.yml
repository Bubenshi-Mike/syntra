name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      # Full history (not the default shallow clone) - the package version is derived from
      # the total commit count via `git rev-list --count HEAD` (see Directory.Build.props),
      # which needs the whole history to be accurate.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Syntra.slnx

      # Report-only: a repo this young doesn't yet warrant hard-failing CI on findings.
      # Revisit once there's a real baseline and a process for triaging/dismissing them.
      - name: Security audit (vulnerable packages)
        run: dotnet list Syntra.slnx package --vulnerable --include-transitive
        continue-on-error: true

      - name: Outdated packages (informational)
        run: dotnet list Syntra.slnx package --outdated
        continue-on-error: true

      - name: Build
        run: dotnet build Syntra.slnx -c Release --no-restore

      - name: Format check
        run: dotnet format Syntra.slnx --verify-no-changes

      # Known gap: coverlet's static instrumentation can't resolve Microsoft.Extensions.*
      # assemblies trimmed from build output because Syntra.Behaviors' FrameworkReference
      # on Microsoft.AspNetCore.App marks them as framework-provided. Syntra.Behaviors and
      # Syntra.DependencyInjection are silently absent from the coverage report as a result
      # (verified: neither CopyLocalLockFileAssemblies nor PreserveCompilationContext fix it).
      # Resolving the FrameworkReference (see roadmap) would likely fix this too.
      - name: Test
        run: dotnet test Syntra.slnx -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory "${{ github.workspace }}/coverage"

      - name: Pack
        run: dotnet pack Syntra.slnx -c Release --no-build -o "${{ github.workspace }}/artifacts"

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/**/coverage.cobertura.xml
