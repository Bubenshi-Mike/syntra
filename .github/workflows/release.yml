# Push packages to NuGet.org when a version tag is pushed (e.g. v2.15). The tag itself only
# triggers the publish - the actual package version is computed from the commit count, not
# parsed from the tag name (see the "Compute version" step below).
# Repository URL in Directory.Build.props must match this repo.
# Add NUGET_API_KEY as a repository secret.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history (not the default shallow clone) - the package version is derived from
      # the total commit count via `git rev-list --count HEAD` (see Directory.Build.props),
      # which needs the whole history to be accurate.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Same Major.Height.0 computation as the CI workflow, but without the -g{sha} suffix -
      # this is a public release, not a CI build artifact. The tag that triggered this workflow
      # is only what starts the publish; the actual version comes from the commit count so there
      # is still no manual number-picking anywhere in the process.
      - name: Compute version
        id: version
        run: echo "value=2.$(git rev-list --count HEAD).0" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack Syntra.slnx -c Release -o "${{ github.workspace }}/artifacts" -p:Version=${{ steps.version.outputs.value }}

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
